<text x="40" y="384" font-size="9.6" fill="#6b6258" font-weight="normal" text-anchor="start">서버 먼저 · 한 대씩 · 확인하고 다음. 스냅샷이 되돌릴 자리. Rocky는 /usr/bin(RPM), Ubuntu는 /usr/local/bin(tarball).</text>

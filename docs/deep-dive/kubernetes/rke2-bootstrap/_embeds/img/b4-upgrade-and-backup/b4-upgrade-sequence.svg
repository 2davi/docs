<text x="671.0" y="227" font-size="8.8" fill="#6b6258" font-weight="500" text-anchor="middle">전 노드 v1.36.2</text>
<line x1="245.0" y1="244" x2="245.0" y2="302" stroke="#c0584f" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#aDeny)"/>

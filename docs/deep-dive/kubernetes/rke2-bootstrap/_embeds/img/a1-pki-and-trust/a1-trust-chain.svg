<rect x="13" y="13" width="754" height="466" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="34" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">인증서 신뢰 계층</text>
<text x="34" y="70" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">단일 자체 서명 CA가 여덟 장을 발급한다 — 신원(CN·O)과 SAN</text>
<rect x="310" y="80" width="160" height="58" rx="10" stroke="#8a6db5" stroke-width="1.6" fill="#efeaf5" filter="url(#soft)"/>
<text x="390.0" y="104" font-size="12" fill="#8a6db5" font-weight="700" text-anchor="middle">root CA · 자체 서명</text>
<text x="390.0" y="122" font-size="9.5" fill="#6b6258" font-weight="normal" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">ca.key · ca.crt</text>
<text x="390.0" y="150" font-size="9" fill="#8a8076" font-weight="normal" text-anchor="middle">자기 자신을 서명한 신뢰 앵커 · CSR 없음</text>

<text x="52" y="288" font-size="9" fill="#6b6258" font-weight="normal" text-anchor="start" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">SAN — 127.0.0.1</text>
<text x="52" y="303" font-size="9" fill="#6b6258" font-weight="normal" text-anchor="start" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">10.32.0.1 (svc ClusterIP)</text>
<text x="52" y="318" font-size="9" fill="#6b6258" font-weight="normal" text-anchor="start" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">server.kubernetes.local</text>
<text x="52" y="333" font-size="9" fill="#da7756" font-weight="600" text-anchor="start">노드 IP 없음 (이름 기반)</text>

<rect x="274" y="262" width="232" height="26" rx="7" stroke="#5b86c4" stroke-width="1" fill="#eaf0f9"/>
<text x="284" y="279.0" font-size="10" fill="#2b2722" font-weight="500" text-anchor="start" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">node-0</text>
<rect x="274" y="294" width="232" height="26" rx="7" stroke="#5b86c4" stroke-width="1" fill="#eaf0f9"/>
<text x="284" y="311.0" font-size="10" fill="#2b2722" font-weight="500" text-anchor="start" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">node-1</text>
<rect x="274" y="326" width="232" height="26" rx="7" stroke="#5b86c4" stroke-width="1" fill="#eaf0f9"/>
<text x="284" y="343.0" font-size="10" fill="#2b2722" font-weight="500" text-anchor="start" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">kube-proxy</text>
<rect x="274" y="358" width="232" height="26" rx="7" stroke="#5b86c4" stroke-width="1" fill="#eaf0f9"/>
<text x="284" y="375.0" font-size="10" fill="#2b2722" font-weight="500" text-anchor="start" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">kube-scheduler</text>
<rect x="274" y="390" width="232" height="26" rx="7" stroke="#5b86c4" stroke-width="1" fill="#eaf0f9"/>
<text x="284" y="407.0" font-size="10" fill="#2b2722" font-weight="500" text-anchor="start" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">kube-controller-manager</text>
<text x="270" y="430" font-size="9" fill="#6b6258" font-weight="normal" text-anchor="start">IP 없음 · CN·O가 곧 권한</text>
<text x="270" y="444" font-size="8.5" fill="#8a8076" font-weight="normal" text-anchor="start" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">admin=system:masters · node=system:node</text>
<rect x="540" y="192" width="200" height="28" rx="8" stroke="#e0a64e" stroke-width="1" fill="#e0a64e"/>
<text x="640.0" y="210.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">서비스 어카운트 · 1</text>
<rect x="556" y="232" width="168" height="32" rx="8" stroke="#e0a64e" stroke-width="1.2" fill="#fcfbf9"/>
<text x="640.0" y="252" font-size="11" fill="#2b2722" font-weight="600" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">service-accounts</text>
<text x="552" y="288" font-size="9" fill="#6b6258" font-weight="normal" text-anchor="start">SA 토큰 서명·검증 키쌍</text>
<text x="552" y="303" font-size="9" fill="#6b6258" font-weight="normal" text-anchor="start">TLS 피어 신원이 아님</text>
<text x="40" y="456" font-size="9.7" fill="#da7756" font-weight="600" text-anchor="start">여덟 장 모두 이 CA 하나로 검증된다 — N² 신뢰가 N으로 접힌다.</text>
<text x="40" y="472" font-size="9" fill="#6b6258" font-weight="normal" text-anchor="start">apiserver SAN은 노드 IP를 굽지 않고 이름에 기댄다 (kubeadm은 노드 IP를 넣어 대비된다).</text>

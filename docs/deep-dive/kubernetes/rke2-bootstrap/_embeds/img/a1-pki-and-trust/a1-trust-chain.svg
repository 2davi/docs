<line x1="390.0" y1="138" x2="640.0" y2="192" stroke="#6b6258" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="398.0" y="168" font-size="8.5" fill="#6b6258" font-weight="normal" text-anchor="start">서명(sign)</text>

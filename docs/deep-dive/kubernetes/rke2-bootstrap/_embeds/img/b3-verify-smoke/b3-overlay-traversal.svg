<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="734" height="374" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="34" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">노드 간 오버레이 횡단</text>
<text x="34" y="70" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">Calico VXLAN이 파드 트래픽을 노드 너머로, 라우트 없이</text>
<rect x="48" y="92" width="300" height="214" rx="12" stroke="#4a9d7f" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<rect x="48" y="92" width="300" height="32" rx="12" stroke="#4a9d7f" stroke-width="1" fill="#e8f3ee"/>
<text x="64" y="113" font-size="11.5" fill="#2b2722" font-weight="700" text-anchor="start">rke2-agent-0 · Ubuntu</text>
<rect x="72" y="142" width="252" height="46" rx="8" stroke="#cfe6da" stroke-width="1" fill="#e8f3ee"/>
<text x="86" y="162" font-size="11" fill="#2b2722" font-weight="700" text-anchor="start">pod: tester</text>
<text x="86" y="179" font-size="9.2" fill="#6b6258" font-weight="normal" text-anchor="start" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">10.42.0.x  (busybox)</text>
<rect x="72" y="230" width="252" height="36" rx="8" stroke="#e2dcd2" stroke-width="1" fill="#f1ede6"/>
<text x="86" y="253" font-size="10.5" fill="#2b2722" font-weight="600" text-anchor="start">vxlan.calico</text>
<text x="86" y="290" font-size="9.0" fill="#8a8076" font-weight="normal" text-anchor="start" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">eth1  10.240.0.31</text>
<line x1="198.0" y1="188" x2="198.0" y2="230" stroke="#da7756" stroke-width="1.8" marker-end="url(#aTerra)"/>
<text x="206.0" y="214" font-size="8.8" fill="#da7756" font-weight="600" text-anchor="start">encap</text>
<rect x="412" y="92" width="300" height="214" rx="12" stroke="#e0a64e" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<rect x="412" y="92" width="300" height="32" rx="12" stroke="#e0a64e" stroke-width="1" fill="#fdf3e3"/>
<text x="428" y="113" font-size="11.5" fill="#2b2722" font-weight="700" text-anchor="start">rke2-agent-1 · Rocky</text>
<rect x="436" y="142" width="252" height="46" rx="8" stroke="#cfe6da" stroke-width="1" fill="#e8f3ee"/>
<text x="450" y="162" font-size="11" fill="#2b2722" font-weight="700" text-anchor="start">pod: web-rocky</text>
<text x="450" y="179" font-size="9.2" fill="#6b6258" font-weight="normal" text-anchor="start" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">10.42.1.x  (nginx)</text>
<rect x="436" y="230" width="252" height="36" rx="8" stroke="#e2dcd2" stroke-width="1" fill="#f1ede6"/>
<text x="450" y="253" font-size="10.5" fill="#2b2722" font-weight="600" text-anchor="start">vxlan.calico</text>
<text x="450" y="290" font-size="9.0" fill="#8a8076" font-weight="normal" text-anchor="start" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">eth1  10.240.0.32</text>
<line x1="562.0" y1="230" x2="562.0" y2="188" stroke="#da7756" stroke-width="1.8" marker-end="url(#aTerra)"/>
<text x="570.0" y="214" font-size="8.8" fill="#da7756" font-weight="600" text-anchor="start">decap</text>
<line x1="348" y1="248" x2="412" y2="248" stroke="#da7756" stroke-width="2.4" marker-end="url(#aTerra)"/>
<text x="380.0" y="240" font-size="9.5" fill="#da7756" font-weight="700" text-anchor="middle">VXLAN</text>
<text x="380.0" y="265" font-size="8.6" fill="#6b6258" font-weight="500" text-anchor="middle">UDP 8472</text>
<text x="48" y="340" font-size="9.8" fill="#6b6258" font-weight="normal" text-anchor="start">논리적으로 tester → web-rocky 한 홉. 물리적으로 VXLAN이 전용선(10.240.0.0/24)으로 캡슐화해 노드를 넘긴다.</text>
<text x="48" y="362" font-size="9.8" fill="#6b6258" font-weight="normal" text-anchor="start">손으로 깐 정적 라우트는 한 줄도 없다. Ubuntu 노드 → Rocky 노드, 오버레이가 그 홉을 잇는다.</text>
</svg>

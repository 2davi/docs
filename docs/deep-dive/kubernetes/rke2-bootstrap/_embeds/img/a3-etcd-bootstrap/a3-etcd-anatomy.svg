<svg viewBox="0 0 760 496" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="734" height="470" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="40" y="46" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">etcd 단일 노드 해부</text>
<text x="40" y="66" font-size="12" fill="#6b6258" font-weight="normal" text-anchor="start">루프백 평문 통신 · 복사됐으나 미사용된 인증서 · 파일 권한 방어</text>
<rect x="36" y="88" width="688" height="340" rx="14" stroke="#8a6db5" stroke-width="1.6" fill="#efeaf5"/>
<text x="52" y="114" font-size="13.5" fill="#2b2722" font-weight="700" text-anchor="start">server 호스트 · 10.240.0.10</text>
<rect x="500" y="98" width="216" height="26" rx="8" stroke="#e2dcd2" stroke-width="1" fill="#f1ede6"/>
<text x="608.0" y="115.0" font-size="10" fill="#9a9388" font-weight="600" text-anchor="middle">127.0.0.1 (lo) · 외부 도달 불가</text>
<rect x="64" y="150" width="150" height="84" rx="10" stroke="#8a8076" stroke-width="1.2" fill="#fcfbf9"/>
<text x="139" y="178" font-size="12.5" fill="#2b2722" font-weight="600" text-anchor="middle">kube-apiserver</text>
<text x="139" y="197" font-size="9.5" fill="#8a8076" font-weight="normal" text-anchor="middle">etcd의 유일한 클라이언트</text>
<text x="139" y="215" font-size="10" fill="#6b6258" font-weight="normal" text-anchor="middle">(A4에서 등장)</text>
<line x1="214" y1="192" x2="300" y2="192" stroke="#6b6258" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="257" y="182" font-size="10" fill="#6b6258" font-weight="600" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">http · :2379</text>
<text x="257" y="206" font-size="9.5" fill="#c0584f" font-weight="normal" text-anchor="middle">평문 · TLS 아님</text>
<rect x="300" y="150" width="168" height="132" rx="11" stroke="#2b2722" stroke-width="1.5" fill="#fcfbf9"/>
<text x="384" y="180" font-size="18" fill="#2b2722" font-weight="700" text-anchor="middle">etcd</text>
<text x="384" y="199" font-size="10.5" fill="#6b6258" font-weight="normal" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">--name controller</text>
<line x1="316" y1="212" x2="452" y2="212" stroke="#e2dcd2" stroke-width="1"/>
<text x="384" y="234" font-size="11" fill="#2b2722" font-weight="normal" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">:2379  client</text>
<text x="384" y="256" font-size="11" fill="#2b2722" font-weight="normal" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">:2380  peer=self</text>
<rect x="516" y="150" width="176" height="72" rx="10" stroke="#4a9d7f" stroke-width="1.3" fill="#e8f3ee"/>
<text x="604" y="178" font-size="12.5" fill="#2b2722" font-weight="600" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">/var/lib/etcd</text>
<text x="604" y="198" font-size="10" fill="#6b6258" font-weight="normal" text-anchor="middle">chmod 700 · 데이터 원본</text>
<line x1="468" y1="186" x2="516" y2="186" stroke="#6b6258" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="492" y="178" font-size="9" fill="#8a8076" font-weight="normal" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">R/W</text>
<rect x="516" y="250" width="176" height="54" rx="10" stroke="#da7756" stroke-width="1.6" fill="#fcfbf9"/>
<text x="604" y="274" font-size="12.5" fill="#da7756" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">snapshot.db</text>
<text x="604" y="292" font-size="9.5" fill="#6b6258" font-weight="normal" text-anchor="middle">유일한 생명선</text>
<line x1="604" y1="222" x2="604" y2="250" stroke="#da7756" stroke-width="1.8" marker-end="url(#aTerra)"/>
<text x="614" y="240" font-size="9.5" fill="#da7756" font-weight="normal" text-anchor="start" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">snapshot save</text>
<rect x="70" y="322" width="214" height="80" rx="10" stroke="#eed4cf" stroke-width="1.3" fill="#f8ebe8"/>
<text x="177" y="348" font-size="12" fill="#c0584f" font-weight="600" text-anchor="middle">/etc/etcd/ 인증서</text>
<text x="177" y="368" font-size="9" fill="#6b6258" font-weight="normal" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">ca.crt · kube-api-server.{crt,key}</text>
<text x="177" y="386" font-size="10.5" fill="#c0584f" font-weight="700" text-anchor="middle">복사됨 · 유닛이 미참조</text>
<line x1="360" y1="282" x2="210" y2="322" stroke="#eed4cf" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="280" y1="297" x2="290" y2="307" stroke="#c0584f" stroke-width="2.0"/>
<line x1="290" y1="297" x2="280" y2="307" stroke="#c0584f" stroke-width="2.0"/>
<text x="299" y="304" font-size="9" fill="#c0584f" font-weight="600" text-anchor="start">미사용</text>
<text x="40" y="452" font-size="11" fill="#da7756" font-weight="700" text-anchor="start">방어 = 루프백(호스트 밖 불가) + chmod 700(root 전용), TLS 미구성</text>
<text x="40" y="471" font-size="10.5" fill="#6b6258" font-weight="normal" text-anchor="start">인증서는 /etc/etcd/에 있으나 평문 유닛이 참조하지 않는다. 트랙 B RKE2 etcd가 이 대조의 반대편.</text>
</svg>

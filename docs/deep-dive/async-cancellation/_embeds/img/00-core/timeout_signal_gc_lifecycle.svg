<svg viewBox="0 0 780 270" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="754" height="245" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="34" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">timeout 시그널의 GC 생애주기</text>
<text x="34" y="70" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">응답이 일찍 도착하면 — 무엇이, 왜 정리되는가</text>
<rect x="24" y="104" width="156" height="82" rx="10" stroke="#da7756" stroke-width="1.3" fill="#fcfbf9"/>
<text x="102.0" y="134" font-size="12.5" fill="#da7756" font-weight="700" text-anchor="middle">fetch 성공 settle</text>
<text x="102.0" y="154" font-size="10" fill="#6b6258" font-weight="400" text-anchor="middle">응답 2초에 도착</text>
<line x1="180" y1="145.0" x2="216" y2="145.0" stroke="#6b6258" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="216" y="104" width="156" height="82" rx="10" stroke="#e2dcd2" stroke-width="1.3" fill="#f1ede6"/>
<text x="294.0" y="134" font-size="12.5" fill="#2b2722" font-weight="700" text-anchor="middle">옵저버 제거</text>
<text x="294.0" y="154" font-size="10" fill="#6b6258" font-weight="400" text-anchor="middle">fetch가 등록한</text>
<text x="294.0" y="168" font-size="10" fill="#6b6258" font-weight="400" text-anchor="middle">중단 알고리즘 떼짐</text>
<line x1="372" y1="145.0" x2="408" y2="145.0" stroke="#6b6258" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="408" y="104" width="156" height="82" rx="10" stroke="#cfe6da" stroke-width="1.3" fill="#e8f3ee"/>
<text x="486.0" y="134" font-size="12.5" fill="#2b2722" font-weight="700" text-anchor="middle">수거 적격</text>
<text x="486.0" y="154" font-size="10" fill="#6b6258" font-weight="400" text-anchor="middle">옵저버 0 · 참조 0</text>
<text x="486.0" y="168" font-size="10" fill="#6b6258" font-weight="400" text-anchor="middle">(도달 불가)</text>
<line x1="564" y1="145.0" x2="600" y2="145.0" stroke="#6b6258" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="600" y="104" width="156" height="82" rx="10" stroke="#cfe6da" stroke-width="1.3" fill="#e8f3ee"/>
<text x="678.0" y="134" font-size="12.5" fill="#2b2722" font-weight="700" text-anchor="middle">타이머 정리</text>
<text x="678.0" y="154" font-size="10" fill="#6b6258" font-weight="400" text-anchor="middle">1초 남은 타이머가</text>
<text x="678.0" y="168" font-size="10" fill="#6b6258" font-weight="400" text-anchor="middle">시그널과 함께 폐기</text>
<text x="34" y="220" font-size="11" fill="#da7756" font-weight="700" text-anchor="start">수거 적격 ≠ 즉시 회수 — GC는 비결정적이라 다음 수거 때 회수한다.</text>
<text x="34" y="240" font-size="9.6" fill="#8a8076" font-weight="400" text-anchor="start">관찰할 수 없는 타임아웃 타이머가 자원을 낭비하는 것을 막기 위한 설계.</text>
</svg>

<svg viewBox="0 0 768 400" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="742" height="374" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="34" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">통보 → 조율 → 통제 ─ 세 층위와 각 도구</text>
<text x="34" y="70" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">축2는 '통보 ≠ 조율'을, 축3은 '조율 ≠ 통제'를 세웠다. 세 층위는 위계가 아니라 분업.</text>
<rect x="56" y="100" width="656" height="74" rx="10" stroke="#c3d3ec" stroke-width="1.5" fill="#eaf0f9"/>
<text x="76" y="130" font-size="13.5" fill="#5b86c4" font-weight="700" text-anchor="start">통보 (notification)</text>
<text x="76" y="154" font-size="10.8" fill="#2b2722" font-weight="500" text-anchor="start">무슨 일이 일어났나</text>
<text x="690" y="130" font-size="10.5" fill="#6b6258" font-weight="600" text-anchor="end" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">dispatchEvent · CustomEvent · progress</text>
<rect x="600" y="144" width="100" height="22" rx="11" stroke="#c3d3ec" stroke-width="1" fill="#fcfbf9"/>
<text x="650" y="159" font-size="9.6" fill="#5b86c4" font-weight="700" text-anchor="middle">축2</text>
<rect x="56" y="190" width="656" height="74" rx="10" stroke="#cfe6da" stroke-width="1.5" fill="#e8f3ee"/>
<text x="76" y="220" font-size="13.5" fill="#3f8e70" font-weight="700" text-anchor="start">조율 (coordination)</text>
<text x="76" y="244" font-size="10.8" fill="#2b2722" font-weight="500" text-anchor="start">여러 비동기를 언제 모으나</text>
<text x="690" y="220" font-size="10.5" fill="#6b6258" font-weight="600" text-anchor="end" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">Promise.all · allSettled · race · any</text>
<rect x="600" y="234" width="100" height="22" rx="11" stroke="#cfe6da" stroke-width="1" fill="#fcfbf9"/>
<text x="650" y="249" font-size="9.6" fill="#3f8e70" font-weight="700" text-anchor="middle">축3</text>
<rect x="56" y="280" width="656" height="74" rx="10" stroke="#eed4cf" stroke-width="1.5" fill="#f8ebe8"/>
<text x="76" y="310" font-size="13.5" fill="#c0584f" font-weight="700" text-anchor="start">통제 (control)</text>
<text x="76" y="334" font-size="10.8" fill="#2b2722" font-weight="500" text-anchor="start">안 끝난 걸 실제로 끊나</text>
<text x="690" y="310" font-size="10.5" fill="#6b6258" font-weight="600" text-anchor="end" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">AbortController · signal · abort()</text>
<rect x="600" y="324" width="100" height="22" rx="11" stroke="#eed4cf" stroke-width="1" fill="#fcfbf9"/>
<text x="650" y="339" font-size="9.6" fill="#c0584f" font-weight="700" text-anchor="middle">코어</text>
<text x="384" y="372" font-size="11.5" fill="#da7756" font-weight="600" text-anchor="middle">결합자로 묶고, 컨트롤러로 끊는다 — 두 손을 같이 써야 누수가 없다</text>
</svg>

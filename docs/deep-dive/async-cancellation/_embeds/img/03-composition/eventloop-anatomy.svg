<svg viewBox="0 0 768 460" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="742" height="434" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="34" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">이벤트 루프 해부 ─ 콜 스택과 두 큐</text>
<text x="34" y="70" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">스택이 비면 루프가 돈다: 마이크로 큐를 몽땅 비우고, 매크로 큐에서 하나 꺼낸다.</text>
<rect x="56" y="110" width="190" height="300" rx="11" stroke="#c3d3ec" stroke-width="1.5" fill="#eaf0f9"/>
<text x="151" y="138" font-size="12" fill="#5b86c4" font-weight="700" text-anchor="middle">콜 스택 (Call Stack)</text>
<text x="151" y="156" font-size="9.6" fill="#6b6258" font-weight="500" text-anchor="middle">지금 실행 중인 동기 코드</text>
<rect x="76" y="310" width="150" height="36" rx="6" stroke="#5b86c4" stroke-width="1.2" fill="#fcfbf9"/>
<text x="151" y="332" font-size="10.5" fill="#2b2722" font-weight="600" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">console.log</text>
<rect x="76" y="266" width="150" height="36" rx="6" stroke="#5b86c4" stroke-width="1.2" fill="#fcfbf9"/>
<text x="151" y="288" font-size="10.5" fill="#2b2722" font-weight="600" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">함수 호출</text>
<rect x="76" y="222" width="150" height="36" rx="6" stroke="#5b86c4" stroke-width="1.2" fill="#fcfbf9"/>
<text x="151" y="244" font-size="10.5" fill="#2b2722" font-weight="600" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">(스크립트)</text>
<text x="151" y="398" font-size="9.3" fill="#5b86c4" font-weight="600" text-anchor="middle">▲ 위에서 실행·즉시 pop</text>
<circle cx="384" cy="210" r="48" fill="#fdf3e3" stroke="#da7756" stroke-width="2"/>
<path d="M 362 212 A 22 22 0 1 1 382 232" fill="none" stroke="#da7756" stroke-width="1.6" marker-end="url(#aTerra)" opacity="0.55"/>
<text x="384" y="206" font-size="11.5" fill="#da7756" font-weight="700" text-anchor="middle">이벤트</text>
<text x="384" y="223" font-size="11.5" fill="#da7756" font-weight="700" text-anchor="middle">루프</text>
<text x="384" y="290" font-size="9.6" fill="#6b6258" font-weight="600" text-anchor="middle">스택이 비면 작동</text>
<line x1="251" y1="260" x2="332" y2="200" stroke="#6b6258" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="300" y="150" font-size="9.3" fill="#6b6258" font-weight="600" text-anchor="middle">스택 빔</text>
<rect x="520" y="108" width="200" height="130" rx="11" stroke="#cfe6da" stroke-width="1.5" fill="#e8f3ee"/>
<text x="620" y="134" font-size="12" fill="#3f8e70" font-weight="700" text-anchor="middle">마이크로태스크 큐</text>
<text x="620" y="152" font-size="8.8" fill="#6b6258" font-weight="500" text-anchor="middle">.then · await · queueMicrotask</text>
<rect x="540" y="170" width="50" height="34" rx="6" stroke="#3f8e70" stroke-width="1.1" fill="#fcfbf9"/>
<text x="565" y="191" font-size="10" fill="#3f8e70" font-weight="600" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">m1</text>
<rect x="598" y="170" width="50" height="34" rx="6" stroke="#3f8e70" stroke-width="1.1" fill="#fcfbf9"/>
<text x="623" y="191" font-size="10" fill="#3f8e70" font-weight="600" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">m2</text>
<rect x="656" y="170" width="50" height="34" rx="6" stroke="#3f8e70" stroke-width="1.1" fill="#fcfbf9"/>
<text x="681" y="191" font-size="10" fill="#3f8e70" font-weight="600" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">m3</text>
<text x="620" y="226" font-size="9.3" fill="#3f8e70" font-weight="700" text-anchor="middle">→ 한 번에 몽땅 비움</text>
<path d="M 424 180 C 480 130, 500 120, 520 178" fill="none" stroke="#3f8e70" stroke-width="2" marker-end="url(#aAllow)"/>
<text x="494" y="108" font-size="9.6" fill="#3f8e70" font-weight="700" text-anchor="middle">① 먼저</text>
<rect x="520" y="282" width="200" height="128" rx="11" stroke="#ebd9b0" stroke-width="1.5" fill="#fdf3e3"/>
<text x="620" y="308" font-size="12" fill="#da7756" font-weight="700" text-anchor="middle">매크로태스크 큐</text>
<text x="620" y="326" font-size="8.8" fill="#6b6258" font-weight="500" text-anchor="middle">setTimeout · I/O · 이벤트 콜백</text>
<rect x="550" y="344" width="56" height="34" rx="6" stroke="#da7756" stroke-width="1.1" fill="#fcfbf9"/>
<text x="578" y="365" font-size="10" fill="#da7756" font-weight="600" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">T1</text>
<rect x="616" y="344" width="56" height="34" rx="6" stroke="#da7756" stroke-width="1.1" fill="#fcfbf9"/>
<text x="644" y="365" font-size="10" fill="#da7756" font-weight="600" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">T2</text>
<text x="620" y="398" font-size="9.3" fill="#da7756" font-weight="700" text-anchor="middle">→ 하나만 꺼냄</text>
<path d="M 424 240 C 480 280, 500 285, 520 352" fill="none" stroke="#da7756" stroke-width="2" marker-end="url(#aTerra)"/>
<text x="496" y="300" font-size="9.6" fill="#da7756" font-weight="700" text-anchor="middle">② 그다음</text>
</svg>

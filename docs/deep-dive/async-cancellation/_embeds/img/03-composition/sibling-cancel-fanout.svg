<svg viewBox="0 0 768 420" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="742" height="394" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="34" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">형제 취소 전파 ─ 공유 컨트롤러 fan-out</text>
<text x="34" y="70" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">한 작업이 실패하면 그 .catch가 공유 컨트롤러를 당겨 형제를 일제히 끊는다.</text>
<rect x="300" y="100" width="168" height="48" rx="9" stroke="#eed4cf" stroke-width="1.5" fill="#f8ebe8"/>
<text x="384" y="122" font-size="11.5" fill="#c0584f" font-weight="700" text-anchor="middle">공유 AbortController</text>
<text x="384" y="138" font-size="10" fill="#c0584f" font-weight="500" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">controller.abort()</text>
<rect x="40" y="250" width="140" height="56" rx="9" stroke="#eed4cf" stroke-width="1.5" fill="#f8ebe8"/>
<text x="110" y="274" font-size="13" fill="#c0584f" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">fetchA</text>
<text x="110" y="294" font-size="10" fill="#c0584f" font-weight="600" text-anchor="middle">실패 → abort 당김</text>
<rect x="280" y="250" width="140" height="56" rx="9" stroke="#e2dcd2" stroke-width="1.5" fill="#f1ede6"/>
<text x="350" y="274" font-size="13" fill="#6b6258" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">fetchB</text>
<text x="350" y="294" font-size="10" fill="#6b6258" font-weight="600" text-anchor="middle">signal로 끊김 ✕</text>
<rect x="520" y="250" width="140" height="56" rx="9" stroke="#e2dcd2" stroke-width="1.5" fill="#f1ede6"/>
<text x="590" y="274" font-size="13" fill="#6b6258" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">fetchC</text>
<text x="590" y="294" font-size="10" fill="#6b6258" font-weight="600" text-anchor="middle">signal로 끊김 ✕</text>
<path d="M 110 250 C 110 190, 280 175, 300 144" fill="none" stroke="#c0584f" stroke-width="1.8" marker-end="url(#aDeny)"/>
<text x="180" y="200" font-size="10.5" fill="#c0584f" font-weight="600" text-anchor="start">① 실패가 방아쇠</text>
<path d="M 384 148 C 384 200, 350 195, 350 250" fill="none" stroke="#da7756" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aTerra)"/>
<path d="M 384 148 C 384 200, 590 195, 590 250" fill="none" stroke="#da7756" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aTerra)"/>
<text x="500" y="200" font-size="10.5" fill="#da7756" font-weight="600" text-anchor="start">② 공유 signal이 형제 전멸</text>
<rect x="90" y="340" width="588" height="44" rx="9" stroke="#eBd9b0" stroke-width="1.3" fill="#fdf3e3"/>
<text x="106" y="367" font-size="11" fill="#da7756" font-weight="700" text-anchor="start" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">.catch(err =&gt; { ctrl.abort(); throw err; })</text>
<text x="430" y="367" font-size="10.8" fill="#2b2722" font-weight="500" text-anchor="start">throw 없으면 실패가 fulfilled로 둔갑 · abort는 멱등</text>
</svg>

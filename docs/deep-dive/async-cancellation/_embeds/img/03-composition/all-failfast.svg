<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="734" height="374" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="34" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">Promise.all ─ fail-fast와 버려지는 형제</text>
<text x="34" y="70" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">a가 reject하는 순간 all은 즉시 reject. 하지만 b·c는 끊기지 않고 계속 돈다.</text>
<text x="60" y="118" font-size="10.5" fill="#8a8076" font-weight="normal" text-anchor="start">t=0</text>
<line x1="60" y1="130" x2="700" y2="130" stroke="#e2dcd2" stroke-width="1.4"/>
<text x="70" y="155" font-size="13" fill="#c0584f" font-weight="700" text-anchor="middle">a</text>
<rect x="92" y="137" width="238.56" height="26" rx="7" stroke="#eed4cf" stroke-width="1.2" fill="#f8ebe8"/>
<text x="322.56" y="155" font-size="15" fill="#c0584f" font-weight="700" text-anchor="middle">✕</text>
<text x="344.56" y="155" font-size="11" fill="#c0584f" font-weight="600" text-anchor="start">reject (3s)</text>
<text x="70" y="215" font-size="13" fill="#6b6258" font-weight="700" text-anchor="middle">b</text>
<rect x="92" y="197" width="465.76" height="26" rx="7" stroke="#e2dcd2" stroke-width="1.2" fill="#f1ede6"/>
<line x1="547.76" y1="210" x2="561.76" y2="210" stroke="#6b6258" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="104" y="215" font-size="11" fill="#6b6258" font-weight="500" text-anchor="start">계속 진행…</text>
<text x="70" y="275" font-size="13" fill="#6b6258" font-weight="700" text-anchor="middle">c</text>
<rect x="92" y="257" width="539.6" height="26" rx="7" stroke="#e2dcd2" stroke-width="1.2" fill="#f1ede6"/>
<line x1="621.6" y1="270" x2="635.6" y2="270" stroke="#6b6258" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="104" y="275" font-size="11" fill="#6b6258" font-weight="500" text-anchor="start">계속 진행…</text>
<line x1="330.56" y1="132" x2="330.56" y2="292" stroke="#c0584f" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="330.56" y="122" font-size="10" fill="#c0584f" font-weight="600" text-anchor="middle">a reject</text>
<rect x="92" y="316" width="568" height="44" rx="9" stroke="#eed4cf" stroke-width="1.4" fill="#f8ebe8"/>
<text x="108" y="343" font-size="12" fill="#c0584f" font-weight="700" text-anchor="start">Promise.all 반환</text>
<text x="257" y="343" font-size="11.5" fill="#2b2722" font-weight="500" text-anchor="start">→ a의 reject 순간 즉시 reject (단락). b·c의 결과는 아무도 안 본다.</text>
</svg>

<text x="92" y="274" font-size="11" fill="#da7756" font-weight="700" text-anchor="start" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">currentCtrl?.abort()  →  new AbortController()  →  fetch({ signal })</text>

<svg viewBox="0 0 768 430" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="742" height="404" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="34" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">race 타임아웃 vs AbortSignal.timeout ─ 소유권</text>
<text x="34" y="70" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">관찰만 하는 race는 원본을 못 끊는다. 소유하는 signal은 실제로 끊는다.</text>
<rect x="40" y="92" width="330" height="290" rx="11" stroke="#eed4cf" stroke-width="1.5" fill="#fcfbf9"/>
<rect x="40" y="92" width="330" height="40" rx="11" stroke="#eed4cf" stroke-width="1.4" fill="#f8ebe8"/>
<text x="205.0" y="118" font-size="14" fill="#c0584f" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">race([작업, 타임아웃])</text>
<text x="64" y="168" font-size="11" fill="#6b6258" font-weight="600" text-anchor="start">작업(fetch)</text>
<rect x="64" y="180" width="282" height="24" rx="7" stroke="#e2dcd2" stroke-width="1.2" fill="#f1ede6"/>
<line x1="334" y1="192" x2="348" y2="192" stroke="#6b6258" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="72" y="197" font-size="10.5" fill="#c0584f" font-weight="600" text-anchor="start">계속 돎 (누수)</text>
<text x="64" y="236" font-size="11" fill="#6b6258" font-weight="600" text-anchor="start">타임아웃(5s)</text>
<line x1="238.84" y1="216" x2="238.84" y2="268" stroke="#da7756" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="238.84" y="258" font-size="10" fill="#da7756" font-weight="600" text-anchor="middle">5s</text>
<rect x="64" y="296" width="282" height="64" rx="8" stroke="#eed4cf" stroke-width="1.2" fill="#f8ebe8"/>
<text x="76" y="320" font-size="10.8" fill="#2b2722" font-weight="500" text-anchor="start">타임아웃이 이겨도 race는 작업을</text>
<text x="76" y="338" font-size="10.8" fill="#2b2722" font-weight="500" text-anchor="start">관찰만 함 → 원본 fetch 안 끊김.</text>
<text x="76" y="356" font-size="10.8" fill="#2b2722" font-weight="500" text-anchor="start">커넥션·서버작업이 샌다.</text>
<rect x="398" y="92" width="330" height="290" rx="11" stroke="#cfe6da" stroke-width="1.5" fill="#fcfbf9"/>
<rect x="398" y="92" width="330" height="40" rx="11" stroke="#cfe6da" stroke-width="1.4" fill="#e8f3ee"/>
<text x="563.0" y="118" font-size="14" fill="#3f8e70" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">AbortSignal.timeout(5s)</text>
<text x="422" y="168" font-size="11" fill="#6b6258" font-weight="600" text-anchor="start">작업(fetch)</text>
<rect x="422" y="180" width="174.84000000000003" height="24" rx="7" stroke="#eed4cf" stroke-width="1.2" fill="#f8ebe8"/>
<text x="588.84" y="197" font-size="14" fill="#c0584f" font-weight="700" text-anchor="middle">✕</text>
<text x="430" y="197" font-size="10.5" fill="#c0584f" font-weight="600" text-anchor="start">끊김</text>
<text x="422" y="236" font-size="11" fill="#6b6258" font-weight="600" text-anchor="start">타임아웃(5s)</text>
<line x1="596.84" y1="216" x2="596.84" y2="268" stroke="#da7756" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="596.84" y="258" font-size="10" fill="#da7756" font-weight="600" text-anchor="middle">5s</text>
<rect x="422" y="296" width="282" height="64" rx="8" stroke="#cfe6da" stroke-width="1.2" fill="#e8f3ee"/>
<text x="434" y="320" font-size="10.8" fill="#2b2722" font-weight="500" text-anchor="start">signal이 작업을 소유 → 5s에</text>
<text x="434" y="338" font-size="10.8" fill="#2b2722" font-weight="500" text-anchor="start">실제로 끊음. TimeoutError로</text>
<text x="434" y="356" font-size="10.8" fill="#2b2722" font-weight="500" text-anchor="start">식별. 누수 없음.</text>
</svg>

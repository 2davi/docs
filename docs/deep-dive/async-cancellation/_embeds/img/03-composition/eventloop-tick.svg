<svg viewBox="0 0 768 400" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="742" height="374" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="34" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">한 틱(tick)의 규칙 ─ 두 비대칭</text>
<text x="34" y="70" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">매크로 하나마다 마이크로를 바닥까지 비운다. 마이크로는 매크로를 항상 이긴다.</text>
<rect x="60" y="150" width="128" height="70" rx="10" stroke="#ebd9b0" stroke-width="1.5" fill="#fdf3e3"/>
<text x="124.0" y="184" font-size="12" fill="#da7756" font-weight="700" text-anchor="middle">매크로 1개</text>
<rect x="232" y="150" width="110" height="70" rx="10" stroke="#cfe6da" stroke-width="1.5" fill="#e8f3ee"/>
<text x="287.0" y="176" font-size="12" fill="#3f8e70" font-weight="700" text-anchor="middle">마이크로</text>
<text x="287.0" y="193" font-size="12" fill="#3f8e70" font-weight="700" text-anchor="middle">전부</text>
<rect x="386" y="150" width="128" height="70" rx="10" stroke="#ebd9b0" stroke-width="1.5" fill="#fdf3e3"/>
<text x="450.0" y="184" font-size="12" fill="#da7756" font-weight="700" text-anchor="middle">매크로 1개</text>
<rect x="558" y="150" width="110" height="70" rx="10" stroke="#cfe6da" stroke-width="1.5" fill="#e8f3ee"/>
<text x="613.0" y="176" font-size="12" fill="#3f8e70" font-weight="700" text-anchor="middle">마이크로</text>
<text x="613.0" y="193" font-size="12" fill="#3f8e70" font-weight="700" text-anchor="middle">전부</text>
<line x1="188" y1="185" x2="232" y2="185" stroke="#6b6258" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="342" y1="185" x2="386" y2="185" stroke="#6b6258" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="514" y1="185" x2="558" y2="185" stroke="#6b6258" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="692" y="185" font-size="20" fill="#da7756" font-weight="700" text-anchor="middle">⟳</text>
<text x="718" y="185" font-size="11" fill="#da7756" font-weight="600" text-anchor="middle">반복</text>
<rect x="60" y="256" width="320" height="110" rx="10" stroke="#c3d3ec" stroke-width="1.4" fill="#eaf0f9"/>
<text x="78" y="282" font-size="12" fill="#5b86c4" font-weight="700" text-anchor="start">비대칭 ①  스택이 먼저</text>
<text x="78" y="306" font-size="10.5" fill="#2b2722" font-weight="500" text-anchor="start">콜 스택에 동기 코드가 남아 있는 한</text>
<text x="78" y="324" font-size="10.5" fill="#2b2722" font-weight="500" text-anchor="start">어떤 큐도 실행되지 않는다.</text>
<text x="78" y="348" font-size="10.5" fill="#6b6258" font-weight="500" text-anchor="start">큐는 스택이 텅 빌 때까지 대기.</text>
<rect x="400" y="256" width="308" height="110" rx="10" stroke="#cfe6da" stroke-width="1.4" fill="#e8f3ee"/>
<text x="418" y="282" font-size="12" fill="#3f8e70" font-weight="700" text-anchor="start">비대칭 ②  마이크로 &gt; 매크로</text>
<text x="418" y="306" font-size="10.5" fill="#2b2722" font-weight="500" text-anchor="start">setTimeout(fn, 0)의 0도</text>
<text x="418" y="324" font-size="10.5" fill="#2b2722" font-weight="500" text-anchor="start">모든 마이크로태스크에 추월당한다.</text>
<text x="418" y="348" font-size="10.5" fill="#6b6258" font-weight="500" text-anchor="start">.then은 항상 setTimeout(,0)을 이긴다.</text>
</svg>

<svg viewBox="0 0 760 404" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="734" height="372" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="36" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">리스너 옵션 넷 — 각자 다른 축의 뿌리</text>
<text x="36" y="70" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">capture·once·passive·signal은 나열된 플래그가 아니라 서로 다른 개념으로 뻗는다</text>
<text x="56" y="100" font-size="12" fill="#8a8076" font-weight="700" text-anchor="start">옵션</text>
<text x="192" y="100" font-size="12" fill="#8a8076" font-weight="700" text-anchor="start">하는 일</text>
<text x="578" y="100" font-size="12" fill="#8a8076" font-weight="700" text-anchor="start">무는 축</text>
<line x1="40" y1="110" x2="720" y2="110" stroke="#e2dcd2" stroke-width="1.2"/>
<rect x="40" y="122" width="120" height="40" rx="8" stroke="#e2dcd2" stroke-width="1" fill="#f1ede6"/>
<text x="100.0" y="146.0" font-size="12.5" fill="#2b2722" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">capture</text>
<text x="178" y="138" font-size="12" fill="#2b2722" font-weight="600" text-anchor="start">전파 단계 지정</text>
<text x="178" y="155" font-size="11" fill="#6b6258" font-weight="normal" text-anchor="start">+ 동일성 판정에 참여</text>
<rect x="575" y="122" width="150" height="40" rx="8" stroke="#da7756" stroke-width="1" fill="#fbeee9"/>
<text x="650.0" y="146.0" font-size="12" fill="#da7756" font-weight="600" text-anchor="middle">전파 (트리)</text>
<line x1="40" y1="170" x2="720" y2="170" stroke="#e2dcd2" stroke-width="0.8"/>
<rect x="40" y="178" width="120" height="40" rx="8" stroke="#e2dcd2" stroke-width="1" fill="#f1ede6"/>
<text x="100.0" y="202.0" font-size="12.5" fill="#2b2722" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">once</text>
<text x="178" y="194" font-size="12" fill="#2b2722" font-weight="600" text-anchor="start">콜백 실행 직전 자동 제거</text>
<text x="178" y="211" font-size="11" fill="#6b6258" font-weight="normal" text-anchor="start">→ 재진입(re-entrancy) 안전</text>
<rect x="575" y="178" width="150" height="40" rx="8" stroke="#da7756" stroke-width="1" fill="#fbeee9"/>
<text x="650.0" y="202.0" font-size="12" fill="#da7756" font-weight="600" text-anchor="middle">책임의 이관</text>
<line x1="40" y1="226" x2="720" y2="226" stroke="#e2dcd2" stroke-width="0.8"/>
<rect x="40" y="234" width="120" height="40" rx="8" stroke="#e2dcd2" stroke-width="1" fill="#f1ede6"/>
<text x="100.0" y="258.0" font-size="12.5" fill="#2b2722" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">passive</text>
<text x="178" y="250" font-size="12" fill="#2b2722" font-weight="600" text-anchor="start">preventDefault 안 쓰기 약속</text>
<text x="178" y="267" font-size="11" fill="#6b6258" font-weight="normal" text-anchor="start">→ 스크롤 즉시 시작</text>
<rect x="575" y="234" width="150" height="40" rx="8" stroke="#da7756" stroke-width="1" fill="#fbeee9"/>
<text x="650.0" y="258.0" font-size="12" fill="#da7756" font-weight="600" text-anchor="middle">능력의 반납</text>
<line x1="40" y1="282" x2="720" y2="282" stroke="#e2dcd2" stroke-width="0.8"/>
<rect x="40" y="290" width="120" height="40" rx="8" stroke="#e2dcd2" stroke-width="1" fill="#f1ede6"/>
<text x="100.0" y="314.0" font-size="12.5" fill="#2b2722" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">signal</text>
<text x="178" y="306" font-size="12" fill="#2b2722" font-weight="600" text-anchor="start">abort 시 자동 제거</text>
<text x="178" y="323" font-size="11" fill="#6b6258" font-weight="normal" text-anchor="start">→ fan-out 일괄 정리</text>
<rect x="575" y="290" width="150" height="40" rx="8" stroke="#da7756" stroke-width="1" fill="#fbeee9"/>
<text x="650.0" y="314.0" font-size="12" fill="#da7756" font-weight="600" text-anchor="middle">수명의 결박</text>
<text x="40" y="366" font-size="11.5" fill="#da7756" font-weight="600" text-anchor="start">옵션 하나하나가 다른 축으로 뻗는 뿌리 — 이 축이 바닥암반인 이유.</text>
</svg>

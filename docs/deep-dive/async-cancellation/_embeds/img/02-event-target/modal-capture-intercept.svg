<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="734" height="424" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="36" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">capture 가로채기 — 모달 오버레이</text>
<text x="36" y="70" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">뒤쪽 클릭을 안쪽 리스너가 처리하기 전에 끊는다. bubble이면 이미 늦다.</text>
<line x1="380" y1="92" x2="380" y2="400" stroke="#e2dcd2" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="52" y="92" width="300" height="34" rx="8" stroke="#cfe6da" stroke-width="1" fill="#e8f3ee"/>
<text x="202.0" y="113.0" font-size="12" fill="#3f8e70" font-weight="600" text-anchor="middle">capture: true — 뒤쪽 클릭 차단</text>
<line x1="197" y1="132" x2="197" y2="156" stroke="#6b6258" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="112" y="158" width="170" height="44" rx="9" stroke="#da7756" stroke-width="1.6" fill="#fbeee9"/>
<text x="197" y="185" font-size="12.5" fill="#2b2722" font-weight="700" text-anchor="middle">document — 가로챔</text>
<line x1="188" y1="211" x2="206" y2="229" stroke="#da7756" stroke-width="3"/>
<line x1="188" y1="229" x2="206" y2="211" stroke="#da7756" stroke-width="3"/>
<text x="218" y="224" font-size="11" fill="#da7756" font-weight="600" text-anchor="start">stopPropagation()</text>
<rect x="112" y="238" width="170" height="44" rx="9" stroke="#e2dcd2" stroke-width="1.2" fill="#f1ede6"/>
<text x="197" y="265" font-size="12.5" fill="#8a8076" font-weight="600" text-anchor="middle">main (뒤쪽)</text>
<rect x="112" y="300" width="170" height="44" rx="9" stroke="#e2dcd2" stroke-width="1.2" fill="#f1ede6"/>
<text x="197" y="327" font-size="12.5" fill="#8a8076" font-weight="600" text-anchor="middle">button</text>
<text x="197" y="372" font-size="11" fill="#6b6258" font-weight="600" text-anchor="middle">도달 못 함 → 뒤쪽 리스너 안 불림</text>
<rect x="408" y="92" width="300" height="34" rx="8" stroke="#eed4cf" stroke-width="1" fill="#f8ebe8"/>
<text x="558.0" y="113.0" font-size="12" fill="#c0584f" font-weight="600" text-anchor="middle">bubble — 이미 늦음</text>
<line x1="553" y1="132" x2="553" y2="300" stroke="#6b6258" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="468" y="158" width="170" height="44" rx="9" stroke="#e2dcd2" stroke-width="1.4" fill="#fcfbf9"/>
<text x="553" y="185" font-size="12.5" fill="#6b6258" font-weight="600" text-anchor="middle">document</text>
<rect x="468" y="238" width="170" height="44" rx="9" stroke="#e2dcd2" stroke-width="1.4" fill="#fcfbf9"/>
<text x="553" y="265" font-size="12.5" fill="#6b6258" font-weight="600" text-anchor="middle">main (뒤쪽)</text>
<rect x="468" y="300" width="170" height="44" rx="9" stroke="#eed4cf" stroke-width="1.6" fill="#f8ebe8"/>
<text x="553" y="322" font-size="12.5" fill="#c0584f" font-weight="700" text-anchor="middle">button</text>
<text x="553" y="337" font-size="10" fill="#c0584f" font-weight="600" text-anchor="middle">리스너 실행됨</text>
<text x="553" y="372" font-size="11" fill="#6b6258" font-weight="600" text-anchor="middle">안쪽이 먼저 반응한 뒤 → 가로채기 실패</text>
<text x="40" y="414" font-size="11.5" fill="#da7756" font-weight="600" text-anchor="start">capture = 조상이 먼저 개입해 안쪽 도달 전 차단. bubble = 안쪽이 반응한 뒤라 가로채기 실패.</text>
</svg>

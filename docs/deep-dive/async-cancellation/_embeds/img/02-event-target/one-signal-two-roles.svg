<svg viewBox="0 0 740 380" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="714" height="354" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="36" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">하나의 signal, 두 역할</text>
<text x="36" y="70" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">abort() 한 번이 리스너 제거와 진행 중 작업 취소를 동시에 일으킨다</text>
<text x="60" y="128" font-size="11" fill="#6b6258" font-weight="normal" text-anchor="start">단 한 번의 종결</text>
<rect x="56" y="138" width="184" height="92" rx="12" stroke="#da7756" stroke-width="1.8" fill="#fbeee9"/>
<text x="148" y="175" font-size="14" fill="#2b2722" font-weight="700" text-anchor="middle">AbortSignal</text>
<text x="148" y="200" font-size="12" fill="#da7756" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">controller.abort()</text>
<path d="M240,168 C320,140 352,116 426,116" fill="none" stroke="#da7756" stroke-width="2.2" marker-end="url(#aTerra)"/>
<path d="M240,200 C320,232 352,256 426,256" fill="none" stroke="#da7756" stroke-width="2.2" marker-end="url(#aTerra)"/>
<rect x="430" y="92" width="278" height="64" rx="10" stroke="#e2dcd2" stroke-width="1.3" fill="#f1ede6"/>
<text x="446" y="120" font-size="13" fill="#2b2722" font-weight="700" text-anchor="start">① { signal } 옵션</text>
<text x="446" y="140" font-size="11" fill="#6b6258" font-weight="normal" text-anchor="start">→ 리스너 제거 · 미래 dispatch 차단</text>
<rect x="430" y="232" width="278" height="64" rx="10" stroke="#e2dcd2" stroke-width="1.3" fill="#f1ede6"/>
<text x="446" y="260" font-size="13" fill="#2b2722" font-weight="700" text-anchor="start">② fetch(signal) 인자</text>
<text x="446" y="280" font-size="11" fill="#6b6258" font-weight="normal" text-anchor="start">→ 진행 중 fetch 취소 · 현재 중단</text>
<text x="40" y="356" font-size="11.5" fill="#da7756" font-weight="600" text-anchor="start">코어와 축2의 융합점 — 같은 시그널 하나가 이벤트 리스너 수명과 비동기 작업 취소를 함께 쥔다.</text>
</svg>

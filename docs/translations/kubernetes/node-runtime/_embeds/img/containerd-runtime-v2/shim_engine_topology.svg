<svg viewBox="0 0 780 428" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="754" height="402" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="34" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">shim+engine 토폴로지</text>
<text x="34" y="70" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">containerd 하나, shim 하나, 컨테이너 여럿 (파드 단위 sandbox-id 그룹)</text>
<rect x="34" y="178" width="150" height="60" rx="9" stroke="#e2dcd2" stroke-width="1.3" fill="#fcfbf9"/>
<text x="109.0" y="205.0" font-size="13" fill="#2b2722" font-weight="700" text-anchor="middle">containerd</text>
<text x="109.0" y="221.0" font-size="9.5" fill="#6b6258" font-weight="500" text-anchor="middle">데몬 · 허브</text>
<rect x="280" y="178" width="200" height="60" rx="9" stroke="#da7756" stroke-width="1.7" fill="#fcfbf9"/>
<text x="380.0" y="205.0" font-size="11" fill="#2b2722" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">containerd-shim-runc-v2</text>
<text x="380.0" y="221.0" font-size="9.5" fill="#6b6258" font-weight="500" text-anchor="middle">shim · ttRPC 리스너</text>
<rect x="540" y="112" width="210" height="172" rx="12" stroke="#e2dcd2" stroke-width="1.2" fill="#f1ede6"/>
<text x="554" y="132" font-size="10.5" fill="#8a8076" font-weight="600" text-anchor="start">쿠버네티스 파드 · sandbox-id 그룹</text>
<rect x="562" y="140" width="166" height="40" rx="9" stroke="#e2dcd2" stroke-width="1.3" fill="#fcfbf9"/>
<text x="645.0" y="164.5" font-size="13" fill="#2b2722" font-weight="700" text-anchor="middle">컨테이너 A</text>
<rect x="562" y="188" width="166" height="40" rx="9" stroke="#e2dcd2" stroke-width="1.3" fill="#fcfbf9"/>
<text x="645.0" y="212.5" font-size="13" fill="#2b2722" font-weight="700" text-anchor="middle">컨테이너 B</text>
<rect x="562" y="236" width="166" height="40" rx="9" stroke="#e2dcd2" stroke-width="1.3" fill="#fcfbf9"/>
<text x="645.0" y="260.5" font-size="13" fill="#2b2722" font-weight="700" text-anchor="middle">컨테이너 C</text>
<line x1="184" y1="208" x2="280" y2="208" stroke="#da7756" stroke-width="1.9" marker-end="url(#aTerra)"/>
<text x="232" y="199" font-size="9.5" fill="#8a8076" font-weight="500" text-anchor="middle">ttRPC · unix 소켓</text>
<line x1="480" y1="202" x2="562" y2="160" stroke="#da7756" stroke-width="1.8" marker-end="url(#aTerra)"/>
<line x1="480" y1="208" x2="562" y2="208" stroke="#da7756" stroke-width="1.8" marker-end="url(#aTerra)"/>
<line x1="480" y1="214" x2="562" y2="256" stroke="#da7756" stroke-width="1.8" marker-end="url(#aTerra)"/>
<line x1="34" y1="320" x2="746" y2="320" stroke="#e2dcd2" stroke-width="1.2"/>
<circle cx="42" cy="341" r="3.2" fill="#da7756"/>
<text x="54" y="345" font-size="10" fill="#2b2722" font-weight="500" text-anchor="start">containerd는 shim 대 컨테이너가 1:1인지 1:다인지 신경 쓰지 않는다. 그룹화는 shim이 결정한다.</text>
<circle cx="42" cy="365" r="3.2" fill="#da7756"/>
<text x="54" y="369" font-size="10" fill="#2b2722" font-weight="500" text-anchor="start">CRI는 같은 파드 컨테이너를 sandbox-id로 묶어 단일 shim에 맡긴다. shim이 컨테이너마다 fork/exec로 runc(엔진)를 호출한다.</text>
<text x="34" y="400" font-size="8.6" fill="#8a8076" font-weight="normal" text-anchor="start">shim = ttRPC 리스너 · runc = 실제 생성·시작·중지. 구조는 원문 'shim+engine 관계' 절의 시각화이며, 다른 파드는 다른 sandbox-id로 별도 shim이 담당한다.</text>
</svg>

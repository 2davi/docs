<line x1="30" y1="352" x2="750" y2="352" stroke="#e2dcd2" stroke-width="1.2"/>
<rect x="30" y="362" width="180" height="46" rx="9" stroke="#8a8076" stroke-width="1.3" fill="#f1ede6"/>
<text x="120" y="380" font-size="11" fill="#2b2722" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">sa</text>
<text x="120" y="397" font-size="9" fill="#6b6258" font-weight="500" text-anchor="middle">독립 키 페어</text>
<text x="228" y="380" font-size="9.5" fill="#2b2722" font-weight="500" text-anchor="start">sa는 CA가 아니다. 서비스 어카운트 토큰 서명용 개인 키(sa.key)와</text>
<text x="228" y="397" font-size="9.5" fill="#2b2722" font-weight="500" text-anchor="start">공개 키(sa.pub) 페어이며, 다른 인증서를 서명하지 않는다.</text>
<text x="34" y="430" font-size="8.6" fill="#8a8076" font-weight="normal" text-anchor="start">스텁 화살표는 CA의 서명 관계를 나타낸다. ca는 kubeconfig 페이즈가 만드는 클라이언트 인증서(admin·controller-manager·scheduler·kubelet)의 서명자이기도 하다.</text>

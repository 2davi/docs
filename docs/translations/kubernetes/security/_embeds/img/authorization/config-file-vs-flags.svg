<text x="392" y="116" font-size="10" fill="#da7756" font-weight="600" text-anchor="middle">상호 배타: --authorization-config 와 --authorization-mode 를 동시에 지정하면 API 서버가 시작 중 오류로 종료</text>
<text x="52" y="169" font-size="11" fill="#6b6258" font-weight="700" text-anchor="start">기능</text>

<text x="52" y="330" font-size="10.5" fill="#2b2722" font-weight="normal" text-anchor="start">무중단 자동 리로드</text>
<rect x="382" y="312" width="84" height="26" rx="13" stroke="#cfe6da" stroke-width="1.0" fill="#e8f3ee"/>
<text x="424" y="329" font-size="10.5" fill="#3f8e70" font-weight="600" text-anchor="middle">지원</text>

<text x="648" y="369" font-size="10.5" fill="#3f8e70" font-weight="600" text-anchor="middle">지원</text>
<line x1="36" y1="388" x2="748" y2="388" stroke="#e2dcd2" stroke-width="1.0"/>
<text x="36" y="410" font-size="10.5" fill="#da7756" font-weight="600" text-anchor="start">고급 기능(다중 웹훅·실패 정책·CEL)이 필요하면 구성 파일을, 단순 조합만 필요하면 플래그를 쓴다. 플래그는 나열 순서가 우선순위다.</text>

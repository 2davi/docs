<rect x="13" y="13" width="758" height="414" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="36" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">인가 설정: 구성 파일 vs 커맨드라인</text>
<text x="36" y="71" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">둘은 상호 배타이며, 고급 기능은 구성 파일 전용이다</text>

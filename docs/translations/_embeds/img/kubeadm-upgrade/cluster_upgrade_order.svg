<svg viewBox="0 0 780 414" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="754" height="388" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="34" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">클러스터 업그레이드 순서와 버전 스큐</text>
<text x="34" y="70" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">첫 컨트롤 플레인은 apply, 나머지 노드는 node · 한 번에 한 노드씩</text>
<rect x="40" y="118" width="206" height="136" rx="12" stroke="#e2dcd2" stroke-width="1.2" fill="#f1ede6"/>
<circle cx="143.0" cy="150" r="15" fill="#da7756"/>
<text x="143.0" y="155" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="143.0" y="191" font-size="12" fill="#2b2722" font-weight="700" text-anchor="middle">첫 컨트롤 플레인 노드</text>
<rect x="58" y="205" width="170" height="26" rx="7" stroke="#e2dcd2" stroke-width="1.1" fill="#fcfbf9"/>
<text x="143.0" y="222" font-size="9" fill="#2b2722" font-weight="600" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">kubeadm upgrade apply &lt;버전&gt;</text>
<text x="143.0" y="247" font-size="9" fill="#8a8076" font-weight="500" text-anchor="middle">최초 1회</text>
<rect x="286" y="118" width="206" height="136" rx="12" stroke="#e2dcd2" stroke-width="1.2" fill="#f1ede6"/>
<circle cx="389.0" cy="150" r="15" fill="#da7756"/>
<text x="389.0" y="155" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="389.0" y="191" font-size="12" fill="#2b2722" font-weight="700" text-anchor="middle">추가 컨트롤 플레인 노드</text>
<rect x="304" y="205" width="170" height="26" rx="7" stroke="#e2dcd2" stroke-width="1.1" fill="#fcfbf9"/>
<text x="389.0" y="222" font-size="9" fill="#2b2722" font-weight="600" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">kubeadm upgrade node</text>
<text x="389.0" y="247" font-size="9" fill="#8a8076" font-weight="500" text-anchor="middle">한 노드씩</text>
<rect x="532" y="118" width="206" height="136" rx="12" stroke="#e2dcd2" stroke-width="1.2" fill="#f1ede6"/>
<circle cx="635.0" cy="150" r="15" fill="#da7756"/>
<text x="635.0" y="155" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="635.0" y="191" font-size="12" fill="#2b2722" font-weight="700" text-anchor="middle">워커 노드</text>
<rect x="550" y="205" width="170" height="26" rx="7" stroke="#e2dcd2" stroke-width="1.1" fill="#fcfbf9"/>
<text x="635.0" y="222" font-size="9" fill="#2b2722" font-weight="600" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">kubeadm upgrade node</text>
<text x="635.0" y="247" font-size="9" fill="#8a8076" font-weight="500" text-anchor="middle">한 노드씩</text>
<line x1="246" y1="186" x2="286" y2="186" stroke="#da7756" stroke-width="1.9" marker-end="url(#aTerra)"/>
<line x1="492" y1="186" x2="532" y2="186" stroke="#da7756" stroke-width="1.9" marker-end="url(#aTerra)"/>
<text x="390" y="278" font-size="9.5" fill="#6b6258" font-weight="500" text-anchor="middle">각 노드에서 kubeadm upgrade 후 kubelet·kubectl 패키지를 새 버전으로 올린다.</text>
<line x1="34" y1="298" x2="746" y2="298" stroke="#e2dcd2" stroke-width="1.2"/>
<text x="34" y="320" font-size="11.5" fill="#da7756" font-weight="700" text-anchor="start">버전 스큐(version skew) 제약</text>
<circle cx="44" cy="340" r="3.2" fill="#c0584f"/>
<text x="54" y="344" font-size="9.5" fill="#2b2722" font-weight="500" text-anchor="start">kubelet은 자신이 통신하는 kube-apiserver보다 최신일 수 없다. 그래서 컨트롤 플레인을 먼저 끝낸다.</text>
<circle cx="44" cy="364" r="3.2" fill="#da7756"/>
<text x="54" y="368" font-size="9.5" fill="#2b2722" font-weight="500" text-anchor="start">마이너 버전은 건너뛸 수 없다 (예: 1.35 → 1.36만 가능, 1.34 → 1.36 불가).</text>
<text x="34" y="394" font-size="8.6" fill="#8a8076" font-weight="normal" text-anchor="start">이 그림은 원문이 링크한 「Upgrading kubeadm clusters」 절차를 시각화한 것이다. 레퍼런스 본문이 아닌 운영 순서다.</text>
</svg>

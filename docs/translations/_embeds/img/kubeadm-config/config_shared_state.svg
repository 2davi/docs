<line x1="490" y1="168" x2="600" y2="144" stroke="#da7756" stroke-width="1.8" marker-end="url(#aTerra)"/>
<line x1="490" y1="182" x2="600" y2="190" stroke="#da7756" stroke-width="1.8" marker-end="url(#aTerra)"/>
<line x1="490" y1="196" x2="600" y2="236" stroke="#da7756" stroke-width="1.8" marker-end="url(#aTerra)"/>
<text x="560" y="150" font-size="9" fill="#8a8076" font-weight="500" text-anchor="middle">읽기</text>
<line x1="385" y1="224" x2="385" y2="280" stroke="#da7756" stroke-width="1.9" marker-end="url(#aTerra)"/>
<text x="396" y="256" font-size="9" fill="#8a8076" font-weight="500" text-anchor="start">설정 파생</text>
<rect x="290" y="280" width="190" height="46" rx="9" stroke="#e2dcd2" stroke-width="1.3" fill="#fcfbf9"/>
<text x="385.0" y="300.0" font-size="12" fill="#2b2722" font-weight="700" text-anchor="middle">컨트롤 플레인</text>
<text x="385.0" y="315.0" font-size="9" fill="#6b6258" font-weight="500" text-anchor="middle">정적 Pod (kube-apiserver 등)</text>
<line x1="480" y1="303" x2="520" y2="303" stroke="#da7756" stroke-width="1.8" marker-end="url(#aTerra)"/>
<rect x="520" y="280" width="190" height="46" rx="9" stroke="#e2dcd2" stroke-width="1.3" fill="#fcfbf9"/>
<text x="615.0" y="300.0" font-size="12" fill="#2b2722" font-weight="700" text-anchor="middle">containerd</text>
<text x="615.0" y="315.0" font-size="9" fill="#6b6258" font-weight="500" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">shim → runc</text>
<text x="34" y="354" font-size="8.6" fill="#8a8076" font-weight="normal" text-anchor="start">이 그림은 시리즈 여섯 문서의 관계를 요약한다. init이 kubeadm-config에 쓰고, join·reset·upgrade가 읽으며, 설정이 정적 Pod와 containerd로 흐른다.</text>

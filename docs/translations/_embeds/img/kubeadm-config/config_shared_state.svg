<text x="115.0" y="178.0" font-size="11.5" fill="#2b2722" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">kubeadm init</text>
<text x="115.0" y="193.0" font-size="9" fill="#6b6258" font-weight="500" text-anchor="middle">설정 업로드</text>
<rect x="280" y="140" width="210" height="84" rx="11" stroke="#da7756" stroke-width="1.8" fill="#fcfbf9"/>
<text x="385.0" y="162" font-size="12.5" fill="#2b2722" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">kubeadm-config</text>
<text x="385.0" y="181" font-size="9.5" fill="#6b6258" font-weight="500" text-anchor="middle">ConfigMap · kube-system</text>
<text x="385.0" y="199" font-size="9.5" fill="#da7756" font-weight="600" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">ClusterConfiguration</text>
<rect x="600" y="124" width="148" height="40" rx="9" stroke="#e2dcd2" stroke-width="1.3" fill="#fcfbf9"/>
<text x="674.0" y="148.5" font-size="11" fill="#2b2722" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">kubeadm join</text>
<rect x="600" y="170" width="148" height="40" rx="9" stroke="#e2dcd2" stroke-width="1.3" fill="#fcfbf9"/>
<text x="674.0" y="194.5" font-size="11" fill="#2b2722" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">kubeadm reset</text>
<rect x="600" y="216" width="148" height="40" rx="9" stroke="#e2dcd2" stroke-width="1.3" fill="#fcfbf9"/>
<text x="674.0" y="240.5" font-size="11" fill="#2b2722" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">kubeadm upgrade</text>
<line x1="190" y1="181" x2="280" y2="181" stroke="#da7756" stroke-width="2" marker-end="url(#aTerra)"/>

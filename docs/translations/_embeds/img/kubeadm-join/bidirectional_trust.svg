<svg viewBox="0 0 780 438" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="754" height="412" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="34" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">kubeadm join의 양방향 신뢰</text>
<text x="34" y="70" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">발견으로 노드가 컨트롤 플레인을, TLS 부트스트랩으로 컨트롤 플레인이 노드를 신뢰</text>
<rect x="40" y="158" width="180" height="104" rx="10" stroke="#e2dcd2" stroke-width="1.3" fill="#fcfbf9"/>
<text x="130.0" y="207.0" font-size="13" fill="#2b2722" font-weight="700" text-anchor="middle">새 노드</text>
<text x="130.0" y="224.0" font-size="10" fill="#6b6258" font-weight="500" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">kubeadm join</text>
<rect x="560" y="158" width="180" height="104" rx="10" stroke="#e2dcd2" stroke-width="1.3" fill="#fcfbf9"/>
<text x="650.0" y="207.0" font-size="13" fill="#2b2722" font-weight="700" text-anchor="middle">컨트롤 플레인</text>
<text x="650.0" y="224.0" font-size="10" fill="#6b6258" font-weight="500" text-anchor="middle">API 서버</text>
<text x="390" y="178" font-size="10.5" fill="#da7756" font-weight="700" text-anchor="middle">①  발견 · 노드 → 컨트롤 플레인</text>
<line x1="224" y1="192" x2="556" y2="192" stroke="#da7756" stroke-width="1.9" marker-end="url(#aTerra)"/>
<text x="390" y="209" font-size="9" fill="#8a8076" font-weight="500" text-anchor="middle">「이 API 서버가 진짜인가」   CA 해시(sha256) · kubeconfig 검증</text>
<text x="390" y="229" font-size="10.5" fill="#da7756" font-weight="700" text-anchor="middle">②  TLS 부트스트랩 · 컨트롤 플레인 → 노드</text>
<line x1="556" y1="243" x2="224" y2="243" stroke="#da7756" stroke-width="1.9" marker-end="url(#aTerra)"/>
<text x="390" y="260" font-size="9" fill="#8a8076" font-weight="500" text-anchor="middle">「이 노드가 합류 자격이 있나」   토큰 → CSR → 인증서 발급(자동 승인)</text>
<text x="390" y="286" font-size="9.5" fill="#6b6258" font-weight="600" text-anchor="middle">양방향 신뢰 확립 → 노드가 확정 신원(kubelet 클라이언트 인증서)으로 API 서버에 접속</text>
<line x1="34" y1="306" x2="746" y2="306" stroke="#e2dcd2" stroke-width="1.2"/>
<text x="34" y="328" font-size="11.5" fill="#da7756" font-weight="700" text-anchor="start">발견 3방식과 보안 트레이드오프</text>
<circle cx="44" cy="346" r="3.2" fill="#3f8e70"/>
<text x="54" y="350" font-size="9.5" fill="#2b2722" font-weight="500" text-anchor="start">CA 고정 토큰 (기본) · CA 공개키 해시를 고정해 가장 안전, 정보가 단일 명령에 담김. CA 생성 전엔 해시 미상.</text>
<circle cx="44" cy="368" r="3.2" fill="#c0584f"/>
<text x="54" y="372" font-size="9.5" fill="#2b2722" font-weight="500" text-anchor="start">CA 고정 없음 (unsafe-skip) · 대칭 토큰만 신뢰, 토큰 유출 시 컨트롤 플레인 사칭 위험.</text>
<circle cx="44" cy="390" r="3.2" fill="#da7756"/>
<text x="54" y="394" font-size="9.5" fill="#2b2722" font-weight="500" text-anchor="start">파일 / HTTPS (--discovery-file) · kubeconfig로 신뢰를 대역 외 전달, 자동화 프로비저닝에 적합.</text>
<text x="34" y="420" font-size="8.6" fill="#8a8076" font-weight="normal" text-anchor="start">양방향 인증이 중간자(MITM) 공격을 막는다. 구조는 원문 개요·「신뢰할 클러스터 CA 발견」 절의 시각화다.</text>
</svg>

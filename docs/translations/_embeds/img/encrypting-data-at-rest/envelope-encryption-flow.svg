<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="694" height="494" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="36" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">봉투 암호화(Envelope Encryption)</text>
<text x="36" y="71" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">데이터는 DEK로, DEK는 다시 KEK로 암호화하는 이중 잠금</text>
<rect x="452" y="92" width="236" height="190" rx="12" stroke="#8a6db5" stroke-width="1.5" fill="#efeaf5" filter="url(#soft)"/>
<text x="468" y="116" font-size="12.5" fill="#8a6db5" font-weight="700" text-anchor="start">KMS · 클러스터 외부</text>
<rect x="468" y="130" width="204" height="46" rx="9" stroke="#8a6db5" stroke-width="1.2" fill="#fcfbf9"/>
<text x="570" y="158" font-size="12" fill="#8a6db5" font-weight="600" text-anchor="middle">KEK · 키 암호화 키</text>
<text x="468" y="202" font-size="10.3" fill="#6b6258" font-weight="normal" text-anchor="start">이 안에서 KEK로 DEK를 암호화한다</text>
<text x="468" y="222" font-size="10" fill="#8a8076" font-weight="normal" text-anchor="start">KEK는 KMS를 떠나지 않는다</text>
<rect x="40" y="96" width="196" height="50" rx="10" stroke="#eed4cf" stroke-width="1.0" fill="#f8ebe8"/>
<text x="138" y="126" font-size="13" fill="#c0584f" font-weight="600" text-anchor="middle">평문 리소스</text>
<line x1="138" y1="148" x2="138" y2="176" stroke="#da7756" stroke-width="1.8" marker-end="url(#aTerra)"/>
<text x="150" y="168" font-size="9.5" fill="#6b6258" font-weight="normal" text-anchor="start">리소스마다 새 DEK 생성</text>
<rect x="40" y="178" width="250" height="52" rx="10" stroke="#da7756" stroke-width="1.6" fill="#fcfbf9"/>
<text x="165" y="202" font-size="12.5" fill="#da7756" font-weight="700" text-anchor="middle">DEK로 데이터 암호화</text>
<text x="165" y="219" font-size="10" fill="#6b6258" font-weight="normal" text-anchor="middle">(AES-GCM)</text>
<line x1="120" y1="232" x2="120" y2="262" stroke="#6b6258" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="264" width="196" height="50" rx="10" stroke="#cfe6da" stroke-width="1.0" fill="#e8f3ee"/>
<text x="138" y="294" font-size="12.5" fill="#3f8e70" font-weight="600" text-anchor="middle">암호문(ciphertext)</text>
<rect x="300" y="184" width="120" height="40" rx="8" stroke="#e2dcd2" stroke-width="1.0" fill="#f1ede6"/>
<text x="360" y="209" font-size="13" fill="#2b2722" font-weight="600" text-anchor="middle">DEK</text>
<line x1="290" y1="204" x2="300" y2="204" stroke="#6b6258" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="420" y1="204" x2="452" y2="204" stroke="#da7756" stroke-width="1.7" marker-end="url(#aTerra)"/>
<rect x="288" y="240" width="132" height="40" rx="8" stroke="#8a6db5" stroke-width="1.0" fill="#efeaf5"/>
<text x="354" y="265" font-size="11.3" fill="#8a6db5" font-weight="600" text-anchor="middle">암호화된 DEK</text>
<line x1="452" y1="260" x2="424" y2="260" stroke="#da7756" stroke-width="1.7" marker-end="url(#aTerra)"/>
<rect x="40" y="344" width="648" height="72" rx="12" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="58" y="370" font-size="13" fill="#2b2722" font-weight="700" text-anchor="start">etcd</text>
<rect x="130" y="376" width="150" height="30" rx="7" stroke="#cfe6da" stroke-width="1.0" fill="#e8f3ee"/>
<text x="205" y="396" font-size="11" fill="#3f8e70" font-weight="600" text-anchor="middle">암호문</text>
<rect x="300" y="376" width="180" height="30" rx="7" stroke="#8a6db5" stroke-width="1.0" fill="#efeaf5"/>
<text x="390" y="396" font-size="11" fill="#8a6db5" font-weight="600" text-anchor="middle">암호화된 DEK</text>
<text x="500" y="396" font-size="10.5" fill="#8a8076" font-weight="normal" text-anchor="start">두 값을 함께 저장</text>
<line x1="138" y1="314" x2="150" y2="344" stroke="#6b6258" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="354" y1="282" x2="360" y2="344" stroke="#6b6258" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="40" y1="430" x2="688" y2="430" stroke="#e2dcd2" stroke-width="1.0"/>
<text x="40" y="452" font-size="11" fill="#da7756" font-weight="600" text-anchor="start">etcd만 유출돼도 KEK가 KMS 안에 있어 DEK를 복호화할 수 없다. 공격자는 etcd와 KMS를 모두 뚫어야 한다.</text>
<text x="40" y="474" font-size="10.5" fill="#6b6258" font-weight="normal" text-anchor="start">읽을 때는 역순이다. KMS가 KEK로 DEK를 풀고, 그 DEK로 암호문을 푼다.</text>
</svg>

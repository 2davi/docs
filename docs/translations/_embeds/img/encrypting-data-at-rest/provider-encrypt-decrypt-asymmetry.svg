<text x="410" y="306" font-size="10.5" fill="#6b6258" font-weight="normal" text-anchor="middle">형식이 맞는 프로바이더가 나올 때까지 순서대로 복호화 시도</text>
<rect x="150" y="330" width="300" height="30" rx="8" stroke="#cfe6da" stroke-width="1.0" fill="#e8f3ee"/>
<text x="300" y="350" font-size="10.5" fill="#3f8e70" font-weight="600" text-anchor="middle">형식 일치 → 그 프로바이더가 복호화</text>
<rect x="468" y="330" width="234" height="30" rx="8" stroke="#eed4cf" stroke-width="1.0" fill="#f8ebe8"/>
<text x="585" y="350" font-size="10.5" fill="#c0584f" font-weight="600" text-anchor="middle">전부 불일치 → 접근 오류</text>
<line x1="40" y1="386" x2="740" y2="386" stroke="#e2dcd2" stroke-width="1.0"/>
<text x="40" y="408" font-size="11" fill="#da7756" font-weight="600" text-anchor="start">그래서 새 키는 목록 2번째에 먼저 넣어 모두가 읽게 한 뒤, 1번째로 올려 암호화에 쓴다. (키 회전의 핵심)</text>
<text x="40" y="430" font-size="10.5" fill="#6b6258" font-weight="normal" text-anchor="start">복호화는 관용적이고 암호화는 배타적이라는 이 비대칭이 무중단 회전을 가능케 한다.</text>

<rect x="13" y="13" width="754" height="444" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="36" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">프로바이더 목록의 쓰기·읽기 비대칭</text>

<svg viewBox="0 0 780 428" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="754" height="402" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="34" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">정적 Pod 생명주기와 제어 비대칭</text>
<text x="34" y="70" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">매니페스트 소스에서 kubelet을 거쳐 실제 컨테이너와 미러 Pod로</text>
<rect x="34" y="128" width="156" height="46" rx="9" stroke="#e2dcd2" stroke-width="1.3" fill="#fcfbf9"/>
<text x="112.0" y="148.0" font-size="12" fill="#2b2722" font-weight="700" text-anchor="middle">파일시스템</text>
<text x="112.0" y="164.0" font-size="9.5" fill="#6b6258" font-weight="500" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">staticPodPath</text>
<rect x="34" y="190" width="156" height="46" rx="9" stroke="#e2dcd2" stroke-width="1.3" fill="#fcfbf9"/>
<text x="112.0" y="210.0" font-size="12" fill="#2b2722" font-weight="700" text-anchor="middle">웹 URL</text>
<text x="112.0" y="226.0" font-size="9.5" fill="#6b6258" font-weight="500" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">--manifest-url</text>
<text x="150" y="118" font-size="9.5" fill="#8a8076" font-weight="500" text-anchor="middle">감시 · 주기 스캔</text>
<rect x="222" y="96" width="250" height="192" rx="12" stroke="#e2dcd2" stroke-width="1.2" fill="#f1ede6"/>
<text x="236" y="116" font-size="11" fill="#8a8076" font-weight="600" text-anchor="start">노드 · kubelet 소유</text>
<rect x="246" y="128" width="202" height="44" rx="9" stroke="#da7756" stroke-width="1.7" fill="#fcfbf9"/>
<text x="347.0" y="154.5" font-size="13.5" fill="#2b2722" font-weight="700" text-anchor="middle">kubelet</text>
<rect x="246" y="208" width="202" height="50" rx="9" stroke="#e2dcd2" stroke-width="1.3" fill="#fcfbf9"/>
<text x="347.0" y="230.0" font-size="12" fill="#2b2722" font-weight="700" text-anchor="middle">실제 컨테이너</text>
<text x="347.0" y="246.0" font-size="9.5" fill="#6b6258" font-weight="500" text-anchor="middle">(CRI 런타임)</text>
<line x1="347" y1="172" x2="347" y2="208" stroke="#da7756" stroke-width="1.8" marker-end="url(#aTerra)"/>
<text x="356" y="194" font-size="9" fill="#8a8076" font-weight="500" text-anchor="start">생성·감시·재시작</text>
<text x="347" y="278" font-size="9.5" fill="#6b6258" font-weight="500" text-anchor="middle">관측: crictl ps</text>
<rect x="506" y="96" width="244" height="192" rx="12" stroke="#e2dcd2" stroke-width="1.2" fill="#f1ede6"/>
<text x="520" y="116" font-size="11" fill="#8a8076" font-weight="600" text-anchor="start">API 서버 · 읽기 전용 뷰</text>
<rect x="530" y="150" width="196" height="50" rx="9" fill="#fcfbf9" stroke="#8a8076" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="628.0" y="172.0" font-size="12" fill="#2b2722" font-weight="700" text-anchor="middle">미러 Pod</text>
<text x="628.0" y="188.0" font-size="9.5" fill="#6b6258" font-weight="500" text-anchor="middle">(mirror Pod)</text>
<text x="628" y="224" font-size="9.5" fill="#6b6258" font-weight="500" text-anchor="middle">관측: kubectl get</text>
<rect x="566" y="240" width="124" height="22" rx="7" stroke="#eed4cf" stroke-width="1" fill="#f8ebe8"/>
<text x="628.0" y="255.0" font-size="10" fill="#c0584f" font-weight="600" text-anchor="middle">삭제 요청 무효</text>
<line x1="190" y1="151" x2="246" y2="145" stroke="#da7756" stroke-width="1.8" marker-end="url(#aTerra)"/>
<line x1="190" y1="213" x2="246" y2="158" stroke="#da7756" stroke-width="1.8" marker-end="url(#aTerra)"/>
<line x1="448" y1="150" x2="530" y2="172" stroke="#da7756" stroke-width="1.8" marker-end="url(#aTerra)"/>
<text x="489" y="143" font-size="9.5" fill="#8a8076" font-weight="500" text-anchor="middle">읽기 전용 투영</text>
<line x1="34" y1="312" x2="746" y2="312" stroke="#e2dcd2" stroke-width="1.2"/>
<text x="34" y="334" font-size="12" fill="#da7756" font-weight="700" text-anchor="start">제어 비대칭</text>
<circle cx="42" cy="353" r="3.2" fill="#c0584f"/>
<text x="54" y="357" font-size="10" fill="#2b2722" font-weight="500" text-anchor="start">kubectl로 미러 Pod를 삭제해도 kubelet이 정적 Pod를 되살린다. 제어는 매니페스트 → kubelet 단방향이다.</text>
<circle cx="42" cy="377" r="3.2" fill="#da7756"/>
<text x="54" y="381" font-size="10" fill="#2b2722" font-weight="500" text-anchor="start">노드에서 컨테이너를 수동으로 멈춰도 kubelet이 자동으로 재시작한다 (자가 치유).</text>
<text x="34" y="407" font-size="8.6" fill="#8a8076" font-weight="normal" text-anchor="start">실선 화살표는 제어·투영 방향, 점선 테두리는 읽기 전용 미러 Pod를 나타낸다.</text>
</svg>

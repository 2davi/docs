<line x1="36" y1="400" x2="748" y2="400" stroke="#e2dcd2" stroke-width="1.0"/>
<text x="36" y="421" font-size="11" fill="#da7756" font-weight="600" text-anchor="start">접근은 기본적으로 거부된다. 어떤 인가자도 명시적으로 허용하지 않으면 요청은 통과하지 못한다.</text>

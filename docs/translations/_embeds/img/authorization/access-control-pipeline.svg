<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="754" height="334" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="36" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">API 접근 제어 파이프라인</text>
<text x="36" y="71" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">요청은 인증·인가·어드미션 세 관문을 통과해야 한다</text>
<text x="40" y="171" font-size="11" fill="#6b6258" font-weight="600" text-anchor="start">요청</text>
<rect x="88" y="138" width="150" height="56" rx="10" stroke="#e2dcd2" stroke-width="1.4" fill="#fcfbf9"/>
<text x="163.0" y="162" font-size="12" fill="#2b2722" font-weight="700" text-anchor="middle">인증</text>
<text x="163.0" y="180" font-size="9.5" fill="#6b6258" font-weight="normal" text-anchor="middle">누구인가</text>
<rect x="270" y="138" width="150" height="56" rx="10" stroke="#da7756" stroke-width="1.7" fill="#fcfbf9"/>
<text x="345.0" y="162" font-size="12" fill="#da7756" font-weight="700" text-anchor="middle">인가</text>
<text x="345.0" y="180" font-size="9.5" fill="#6b6258" font-weight="normal" text-anchor="middle">무엇을 할 수 있나</text>
<rect x="452" y="138" width="168" height="56" rx="10" stroke="#e2dcd2" stroke-width="1.4" fill="#fcfbf9"/>
<text x="536.0" y="162" font-size="11.5" fill="#2b2722" font-weight="700" text-anchor="middle">어드미션 제어</text>
<text x="536.0" y="180" font-size="9.5" fill="#6b6258" font-weight="normal" text-anchor="middle">내용 검증·변형</text>
<rect x="652" y="138" width="96" height="56" rx="10" stroke="#cfe6da" stroke-width="1.0" fill="#e8f3ee"/>
<text x="700" y="162" font-size="11.5" fill="#3f8e70" font-weight="700" text-anchor="middle">허용</text>
<text x="700" y="180" font-size="9.5" fill="#3f8e70" font-weight="normal" text-anchor="middle">처리·저장</text>
<line x1="74" y1="166" x2="88" y2="166" stroke="#6b6258" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="238" y1="166" x2="270" y2="166" stroke="#6b6258" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="420" y1="166" x2="452" y2="166" stroke="#da7756" stroke-width="1.7" marker-end="url(#aTerra)"/>
<text x="436" y="158" font-size="8.5" fill="#da7756" font-weight="600" text-anchor="middle">허용 시</text>
<line x1="620" y1="166" x2="652" y2="166" stroke="#6b6258" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="92.0" y="250" width="142" height="32" rx="7" stroke="#eed4cf" stroke-width="1.0" fill="#f8ebe8"/>
<text x="163" y="270" font-size="10" fill="#c0584f" font-weight="600" text-anchor="middle">인증 실패 → 401</text>
<line x1="163" y1="194" x2="163" y2="250" stroke="#c0584f" stroke-width="1.4" marker-end="url(#aDeny)"/>
<rect x="274.0" y="250" width="142" height="32" rx="7" stroke="#eed4cf" stroke-width="1.0" fill="#f8ebe8"/>
<text x="345" y="270" font-size="10" fill="#c0584f" font-weight="600" text-anchor="middle">인가 거부 → 403</text>
<line x1="345" y1="194" x2="345" y2="250" stroke="#c0584f" stroke-width="1.4" marker-end="url(#aDeny)"/>
<rect x="452.0" y="250" width="168" height="32" rx="7" stroke="#eed4cf" stroke-width="1.0" fill="#f8ebe8"/>
<text x="536" y="270" font-size="10" fill="#c0584f" font-weight="600" text-anchor="middle">어드미션 거부·변형</text>
<line x1="536" y1="194" x2="536" y2="250" stroke="#c0584f" stroke-width="1.4" marker-end="url(#aDeny)"/>
<line x1="36" y1="300" x2="744" y2="300" stroke="#e2dcd2" stroke-width="1.0"/>
<text x="36" y="322" font-size="10.5" fill="#da7756" font-weight="600" text-anchor="start">어드미션은 인가가 '허용'을 낸 요청에만 실행된다. 인가는 요청 속성을, 어드미션은 오브젝트 필드를 본다.</text>
</svg>

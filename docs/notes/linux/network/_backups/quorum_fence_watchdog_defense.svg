<svg viewBox="0 0 760 506" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
  <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b6258"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="10" refX="0.5" refY="4" orient="auto">
    <path d="M8,0 L0,4 L8,8 Z" fill="#6b6258"/></marker>
  <marker id="aAllow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#3f8e70"/></marker>
  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="734" height="480" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="40" y="50" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">Split-Brain 3층 방어 — Quorum · Fence · Watchdog</text>
<text x="40" y="70" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">한 층만으론 부족하다 · 수학·강제·자가가 겹쳐야 어떤 시나리오에서도 막힌다</text>
<rect x="48" y="92" width="168" height="70" rx="10" stroke="#eed4cf" stroke-width="1.2" fill="#f8ebe8"/>
<text x="132" y="120" font-size="13.5" fill="#c0584f" font-weight="700" text-anchor="middle">노드 A</text>
<text x="132" y="140" font-size="11" fill="#c0584f" font-weight="600" text-anchor="middle">고립 · 소수 (1/3)</text>
<rect x="544" y="92" width="168" height="70" rx="10" stroke="#cfe6da" stroke-width="1.2" fill="#e8f3ee"/>
<text x="628" y="116" font-size="13.5" fill="#3f8e70" font-weight="700" text-anchor="middle">노드 B · C</text>
<text x="628" y="135" font-size="11" fill="#3f8e70" font-weight="600" text-anchor="middle">과반 (2/3)</text>
<text x="628" y="152" font-size="10.5" fill="#3f8e70" font-weight="600" text-anchor="middle">→ 결정 권한</text>
<line x1="216" y1="127" x2="372" y2="127" stroke="#c0584f" stroke-width="1.8" stroke-dasharray="7 5"/>
<line x1="388" y1="127" x2="544" y2="127" stroke="#c0584f" stroke-width="1.8" stroke-dasharray="7 5"/>
<line x1="372" y1="119" x2="388" y2="135" stroke="#c0584f" stroke-width="2.2"/>
<line x1="388" y1="119" x2="372" y2="135" stroke="#c0584f" stroke-width="2.2"/>
<text x="380" y="100" font-size="10.5" fill="#6b6258" font-weight="600" text-anchor="middle">네트워크 분단</text>
<text x="380" y="156" font-size="9.6" fill="#8a8076" font-weight="400" text-anchor="middle">B·C 입장: "신호 부재" — (a)죽음/(b)단절 구별 불가 (FLP)</text>
<rect x="48" y="196" width="664" height="78" rx="11" stroke="#e2dcd2" stroke-width="1.4" fill="#fcfbf9"/>
<rect x="48" y="196" width="7" height="78" rx="3" fill="#4a9d7f"/>
<circle cx="92" cy="235.0" r="19" fill="#e8f3ee"/>
<circle cx="92" cy="235.0" r="19" fill="none" stroke="#4a9d7f" stroke-width="1.6"/>
<text x="92" y="241.0" font-size="17" fill="#4a9d7f" font-weight="700" text-anchor="middle">1</text>
<text x="126" y="224" font-size="13.5" fill="#2b2722" font-weight="700" text-anchor="start">Quorum (정족수) · 수학</text>
<text x="126" y="244" font-size="11.2" fill="#6b6258" font-weight="400" text-anchor="start">과반수만 결정 권한을 가진다 · 두 그룹이 동시에 과반일 수 없음(수학적 보장)</text>
<text x="126" y="262" font-size="10.2" fill="#8a8076" font-weight="400" text-anchor="start">홀수 노드 권장 · 짝수는 QDevice로 표 보강</text>
<rect x="48" y="286" width="664" height="78" rx="11" stroke="#e2dcd2" stroke-width="1.4" fill="#fcfbf9"/>
<rect x="48" y="286" width="7" height="78" rx="3" fill="#cc5b53"/>
<circle cx="92" cy="325.0" r="19" fill="#fbeae8"/>
<circle cx="92" cy="325.0" r="19" fill="none" stroke="#cc5b53" stroke-width="1.6"/>
<text x="92" y="331.0" font-size="17" fill="#cc5b53" font-weight="700" text-anchor="middle">2</text>
<text x="126" y="314" font-size="13.5" fill="#2b2722" font-weight="700" text-anchor="start">Fence (펜싱) · 강제</text>
<text x="126" y="334" font-size="11.2" fill="#6b6258" font-weight="400" text-anchor="start">다수 측이 "죽었다"고 판단한 노드를 강제로 격리한다</text>
<text x="126" y="352" font-size="10.2" fill="#8a8076" font-weight="400" text-anchor="start">격리가 확보돼야 다수 측이 안심하고 failover</text>
<rect x="48" y="376" width="664" height="78" rx="11" stroke="#e2dcd2" stroke-width="1.4" fill="#fcfbf9"/>
<rect x="48" y="376" width="7" height="78" rx="3" fill="#e0a64e"/>
<circle cx="92" cy="415.0" r="19" fill="#fdf3e3"/>
<circle cx="92" cy="415.0" r="19" fill="none" stroke="#e0a64e" stroke-width="1.6"/>
<text x="92" y="421.0" font-size="17" fill="#e0a64e" font-weight="700" text-anchor="middle">3</text>
<text x="126" y="404" font-size="13.5" fill="#2b2722" font-weight="700" text-anchor="start">Watchdog · 자가</text>
<text x="126" y="424" font-size="11.2" fill="#6b6258" font-weight="400" text-anchor="start">고립 노드가 softdog 타이머로 스스로 재부팅(self-fence)한다</text>
<text x="126" y="442" font-size="10.2" fill="#8a8076" font-weight="400" text-anchor="start">quorum 잃은 노드가 타이머 리셋 실패 → 자동 재부팅</text>
<text x="380" y="494" font-size="11.5" fill="#da7756" font-weight="700" text-anchor="middle">세 층 — 수학 + 강제 + 자가 — 이 겹쳐야 split-brain이 막힌다</text>
</svg>

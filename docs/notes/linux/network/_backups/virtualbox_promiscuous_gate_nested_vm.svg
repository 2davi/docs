<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Windows 호스트가 중첩 VM-B로 보낸 프레임이 VirtualBox 가상 NIC를 통과해야 Proxmox 브리지와 중첩 VM에 도달하며, 그 통과 여부를 무작위 모드 설정이 결정한다는 흐름도</desc>

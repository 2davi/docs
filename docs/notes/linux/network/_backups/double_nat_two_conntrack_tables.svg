<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Debian VM의 출발지 IP가 pfSense에서 1차로 10.0.2.5로, VirtualBox에서 2차로 Windows IP로 두 번 변환되며, 각 NAT 장비가 자기만의 conntrack 장부를 따로 갖고 서로의 변환을 모른 채 릴레이하는 구조도</desc>

<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">10.10.3.101을 4개 옥텟 32비트 이진수로 펼쳐, 앞 24비트는 네트워크 부분(파랑), 뒤 8비트는 호스트 부분(코랄)으로 나뉘는 것을 보여주는 그림. 경계는 /24.</desc>

  <marker id="aDeny" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0584f"/></marker>
  <marker id="aTerra" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#da7756"/></marker>
</defs>
<rect x="13" y="13" width="694" height="484" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="40" y="52" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">update() — 변경을 화면에 반영하는 단일 통로</text>
<text x="40" y="72" font-size="12.5" fill="#6b6258" font-weight="normal" text-anchor="start">호출 한 번에 일어나는 내부 단계</text>

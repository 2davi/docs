<text x="350" y="430" font-size="11.5" fill="#2b2722" font-weight="700" text-anchor="middle">갱신된 픽셀 그림</text>
<text x="528" y="150" font-size="11" fill="#8a8076" font-weight="700" text-anchor="start">mode 인자</text>
<rect x="528" y="160" width="164" height="40" rx="8" stroke="#cfe6da" stroke-width="1" fill="#e8f3ee"/>
<text x="540" y="178" font-size="10.5" fill="#3f8e70" font-weight="700" text-anchor="start" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">'default'</text>
<text x="540" y="193" font-size="8.5" fill="#6b6258" font-weight="normal" text-anchor="start">애니메이션 동반</text>

<text x="216" y="154" font-size="11" fill="#2b2722" font-weight="700" text-anchor="start">1  옵션 재계산</text>
<text x="216" y="168" font-size="8.6" fill="#6b6258" font-weight="normal" text-anchor="start">변경된 config 를 병합</text>

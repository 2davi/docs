<text x="540" y="241" font-size="8.5" fill="#6b6258" font-weight="normal" text-anchor="start">즉시 (애니 생략)</text>
<rect x="528" y="256" width="164" height="40" rx="8" stroke="#e2dcd2" stroke-width="1" fill="#f1ede6"/>
<text x="540" y="274" font-size="10.5" fill="#9a9388" font-weight="700" text-anchor="start" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">'resize'</text>
<text x="540" y="289" font-size="8.5" fill="#6b6258" font-weight="normal" text-anchor="start">리사이즈 대응</text>

<text x="294" y="151" font-size="11.5" fill="#2b2722" font-weight="700" text-anchor="middle">최초 렌더</text>
<line x1="356" y1="147" x2="392" y2="147" stroke="#6b6258" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="394" y="116" width="130" height="62" rx="10" stroke="#da7756" stroke-width="1.4" fill="#fdf3e3"/>
<text x="459" y="142" font-size="10.5" fill="#2b2722" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">update(mode)</text>
<text x="459" y="162" font-size="9" fill="#6b6258" font-weight="normal" text-anchor="middle">다시 그림</text>
<path d="M432,116 C420,88 498,88 486,116" fill="none" stroke="#da7756" stroke-width="1.5" marker-end="url(#aTerra)"/>
<text x="459" y="82" font-size="8.5" fill="#da7756" font-weight="600" text-anchor="middle">변경마다 반복</text>
<line x1="526" y1="147" x2="560" y2="147" stroke="#6b6258" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="564" y="116" width="112" height="62" rx="10" stroke="#eed4cf" stroke-width="1" fill="#f8ebe8"/>
<text x="620" y="151" font-size="11.5" fill="#c0584f" font-weight="700" text-anchor="middle" font-family="'D2Coding', 'D2Coding ligature', 'DejaVu Sans Mono', monospace">destroy()</text>
<line x1="119" y1="180" x2="119" y2="200" stroke="#8a8076" stroke-width="1" stroke-dasharray="3 3"/>
<text x="119" y="214" font-size="9" fill="#6b6258" font-weight="normal" text-anchor="middle">데이터 준비 직후</text>
<line x1="459" y1="180" x2="459" y2="200" stroke="#8a8076" stroke-width="1" stroke-dasharray="3 3"/>
<text x="459" y="214" font-size="9" fill="#6b6258" font-weight="normal" text-anchor="middle">값·옵션·테마 변경 시</text>
<line x1="620" y1="180" x2="620" y2="200" stroke="#8a8076" stroke-width="1" stroke-dasharray="3 3"/>
<text x="620" y="214" font-size="9" fill="#6b6258" font-weight="normal" text-anchor="middle">이탈·재생성 직전</text>
<rect x="44" y="248" width="632" height="46" rx="9" stroke="#e2dcd2" stroke-width="1" fill="#f1ede6"/>
<text x="360" y="270" font-size="10.5" fill="#2b2722" font-weight="600" text-anchor="middle">Chart.js 는 명령형(imperative) — 생성·갱신·파괴를 개발자가 직접 호출한다</text>
<text x="360" y="286" font-size="9" fill="#6b6258" font-weight="normal" text-anchor="middle">반응형 프레임워크처럼 자동으로 추적·재렌더되지 않는다</text>

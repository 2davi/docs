<rect x="13" y="13" width="694" height="294" rx="16" stroke="#e2dcd2" stroke-width="1.5" fill="#fcfbf9" filter="url(#soft)"/>
<text x="40" y="52" font-size="18.5" fill="#2b2722" font-weight="700" text-anchor="start">색은 JS 한 곳에서 결정한다</text>
